# Proxy reverso de exemplo (Nginx) para publicar o portal em HTTPS.
# 1) copie para /etc/nginx/sites-available/wifi-space-mapper
# 2) ln -s /etc/nginx/sites-available/wifi-space-mapper /etc/nginx/sites-enabled/
# 3) nginx -t && systemctl reload nginx
# 4) certbot --nginx -d mapa.suaempresa.com.br   (opcional, HTTPS gratuito)

server {
    listen 80;
    server_name mapa.suaempresa.com.br;

    client_max_body_size 64m;          # capturas enviadas pelo cliente desktop
    proxy_read_timeout 600s;           # o mapeamento roda no servidor
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
